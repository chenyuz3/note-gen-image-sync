<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="1400" height="800" fill="#ffffff"/>
<text x="70" y="80" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="42" font-weight="700" fill="#172033" text-anchor="start">企业 AI 采用：衡量单位正在下沉</text>
<text x="70" y="122" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="400" fill="#667085" text-anchor="start">旧 Vault 的工具/席位视角，新增了流程单位经济、采购通道与推理部署细节</text>
<line x1="120" y1="390" x2="1280" y2="390" stroke="#dfe5ef" stroke-width="8" stroke-linecap="round"/>
<circle cx="150" cy="390" r="24" fill="#9fb3ff" stroke="white" stroke-width="7"/>
<text x="150" y="308" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="700" fill="#9fb3ff" text-anchor="middle">2025.04</text>
<text x="150" y="462" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">工具试用</text>
<text x="150" y="502" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="500" fill="#667085" text-anchor="middle">角色配置与生产力代理指标</text>
<text x="150" y="535" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="500" fill="#667085" text-anchor="middle">10%–20% 生产力假设</text>
<circle cx="480" cy="390" r="24" fill="#5b7cfa" stroke="white" stroke-width="7"/>
<text x="480" y="308" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="700" fill="#5b7cfa" text-anchor="middle">2026.03</text>
<text x="480" y="462" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">规模部署</text>
<text x="480" y="502" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="500" fill="#667085" text-anchor="middle">Copilot 约 1,500 万付费席位</text>
<text x="480" y="535" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="500" fill="#667085" text-anchor="middle">约占商业席位 3%</text>
<circle cx="810" cy="390" r="24" fill="#8c78d8" stroke="white" stroke-width="7"/>
<text x="810" y="308" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="700" fill="#8c78d8" text-anchor="middle">2026.07</text>
<text x="810" y="462" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">路由评估</text>
<text x="810" y="502" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="500" fill="#667085" text-anchor="middle">成本与质量的 Pareto frontier</text>
<text x="810" y="535" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="500" fill="#667085" text-anchor="middle">任务级 eval 决定策略</text>
<circle cx="1140" cy="390" r="24" fill="#5aa47a" stroke="white" stroke-width="7"/>
<text x="1140" y="308" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="700" fill="#5aa47a" text-anchor="middle">2026.07.24</text>
<text x="1140" y="462" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="27" font-weight="700" fill="#172033" text-anchor="middle">流程经济</text>
<text x="1140" y="502" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="500" fill="#667085" text-anchor="middle">每次客服流程约 $1 → $0.30</text>
<text x="1140" y="535" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="19" font-weight="500" fill="#667085" text-anchor="middle">采购、rate limit、专用端点</text>
<rect x="90" y="650" width="1220" height="88" rx="18" fill="#fff7ed" stroke="#f2c79b"/>
<text x="120" y="688" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="20" font-weight="700" fill="#e49a61" text-anchor="start">证据边界</text>
<text x="255" y="688" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="20" font-weight="500" fill="#172033" text-anchor="start">2026.07.24 的成本、周期与采用比例来自前从业者访谈，属于 expert evidence，尚未独立审计。</text>
<text x="120" y="720" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="20" font-weight="700" fill="#5aa47a" text-anchor="start">边际判断</text>
<text x="255" y="720" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="20" font-weight="500" fill="#172033" text-anchor="start">模型路由的新增价值在执行层：业务 ROI → eval → 采购通道 → 推理服务 → latency / throughput。</text>
</svg>