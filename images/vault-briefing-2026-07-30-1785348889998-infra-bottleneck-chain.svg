<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680"><rect width="1400" height="680" rx="30" fill="#f6f8fb"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#172033">AI workload 的瓶颈传导：两条不同的数据路径</text><text x="70" y="124" font-family="Arial,sans-serif" font-size="20" fill="#667085">综合本期周报、NCCL 与异构推理材料；箭头表示机制顺序，不表示同速增长</text><g font-family="Arial,sans-serif"><rect x="70" y="205" width="230" height="92" rx="18" fill="#dfe8ff"/><text x="185" y="244" text-anchor="middle" font-size="23" font-weight="700" fill="#243b72">Agent / 长上下文</text><text x="185" y="275" text-anchor="middle" font-size="18" fill="#3e5a96">任务与并发增加</text><path d="M310 250 H405" stroke="#5577dd" stroke-width="7"/><rect x="420" y="205" width="250" height="92" rx="18" fill="#dff3ee"/><text x="545" y="244" text-anchor="middle" font-size="23" font-weight="700" fill="#205c50">活跃 KV</text><text x="545" y="275" text-anchor="middle" font-size="18" fill="#3b7569">HBM / DRAM 搬运</text><path d="M680 250 H775" stroke="#57a08f" stroke-width="7"/><rect x="790" y="205" width="240" height="92" rx="18" fill="#efe7fb"/><text x="910" y="244" text-anchor="middle" font-size="23" font-weight="700" fill="#5c3d8a">并行扩展</text><text x="910" y="275" text-anchor="middle" font-size="18" fill="#7658a5">scale-up / all-to-all</text><path d="M1040 250 H1135" stroke="#8f73c7" stroke-width="7"/><rect x="1150" y="205" width="180" height="92" rx="18" fill="#f8eadf"/><text x="1240" y="244" text-anchor="middle" font-size="23" font-weight="700" fill="#80522e">光互连</text><text x="1240" y="275" text-anchor="middle" font-size="18" fill="#9b6b43">NPO / CPO</text><path d="M185 310 V410 H405" stroke="#5577dd" stroke-width="7" fill="none"/><rect x="420" y="365" width="250" height="92" rx="18" fill="#fff0dc"/><text x="545" y="404" text-anchor="middle" font-size="23" font-weight="700" fill="#7a5129">持久化语料</text><text x="545" y="435" text-anchor="middle" font-size="18" fill="#9a6d3c">RAG / 索引 / 快照</text><path d="M680 410 H775" stroke="#c9955b" stroke-width="7"/><rect x="790" y="365" width="240" height="92" rx="18" fill="#f4e8e8"/><text x="910" y="404" text-anchor="middle" font-size="23" font-weight="700" fill="#7b3f3f">副本与冷存储</text><text x="910" y="435" text-anchor="middle" font-size="18" fill="#986161">HDD 的较可信增量</text><text x="70" y="555" font-size="23" font-weight="700" fill="#172033">核心边际</text><text x="70" y="592" font-size="20" fill="#344054">在线 KV 与冷存储是不同需求函数；模型压缩可降低单请求字节数，同时提高系统可承载并发。</text><text x="70" y="628" font-size="18" fill="#667085">图为本期材料的机制综合，不是公司指引或容量预测。</text><polygon points="405,250 389,240 389,260" fill="#5577dd"/><polygon points="775,250 759,240 759,260" fill="#57a08f"/><polygon points="1135,250 1119,240 1119,260" fill="#8f73c7"/><polygon points="405,410 389,400 389,420" fill="#5577dd"/><polygon points="775,410 759,400 759,420" fill="#c9955b"/></g><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker></defs></svg>