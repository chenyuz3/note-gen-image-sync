<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490"><rect width="100%" height="100%" fill="#fbfcfe"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#172033} .t{font-size:30px;font-weight:700} .s{font-size:18px;fill:#5f6b7a} .n{font-size:28px;font-weight:700} .l{font-size:19px} .k{font-size:16px;fill:#64748b}</style><text class="t" x="52" y="58">瓶颈迁移链：模型设计把问题推向下一层</text><text class="s" x="52" y="92">技术边际位于接口：状态如何共享、回滚、搬运与跨设备执行</text><rect x="52" y="150" width="250" height="238" rx="22" fill="#e5eef8" stroke="#d9e0e9"/><text class="l" x="74" y="190" style="font-weight:700">模型状态表示</text><text class="s" x="74" y="230">Full / Sparse / Linear / KDA</text><foreignObject x="74" y="252" width="206" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;color:#566273;line-height:1.5">KV 字节流、可变状态、可共享性</div></foreignObject><path d="M 310 269 H 337" stroke="#738197" stroke-width="4"/><path d="M 337 269 l-12 -8 v16 z" fill="#738197"/><rect x="332" y="150" width="250" height="238" rx="22" fill="#e7f2ec" stroke="#d9e0e9"/><text class="l" x="354" y="190" style="font-weight:700">推理 Runtime</text><text class="s" x="354" y="230">PagedAttention / prefix cache / speculative decode</text><foreignObject x="354" y="252" width="206" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;color:#566273;line-height:1.5">分页、回滚、一致性与调度</div></foreignObject><path d="M 590 269 H 617" stroke="#738197" stroke-width="4"/><path d="M 617 269 l-12 -8 v16 z" fill="#738197"/><rect x="612" y="150" width="250" height="238" rx="22" fill="#f3ecf8" stroke="#d9e0e9"/><text class="l" x="634" y="190" style="font-weight:700">异构执行</text><text class="s" x="634" y="230">GPU / MoE / Groq SRAM</text><foreignObject x="634" y="252" width="206" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;color:#566273;line-height:1.5">专家驻留、参数预取、低延迟</div></foreignObject><path d="M 870 269 H 897" stroke="#738197" stroke-width="4"/><path d="M 897 269 l-12 -8 v16 z" fill="#738197"/><rect x="892" y="150" width="250" height="238" rx="22" fill="#f9eee9" stroke="#d9e0e9"/><text class="l" x="914" y="190" style="font-weight:700">集群互连</text><text class="s" x="914" y="230">CPO / SiPh / scale-out</text><foreignObject x="914" y="252" width="206" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px sans-serif;color:#566273;line-height:1.5">专家通信、机架带宽、封装可维护性</div></foreignObject><text class="k" x="52" y="445">限定：路线图、渗透率和“×倍效率”须按来源口径使用；复杂度优势不自动等于端到端吞吐。</text></svg>