<text x="650" y="406" font-size="16" fill="#6a6259">EPS beat rate</text><rect x="808" y="384" width="180" height="28" rx="14" fill="#dfe7ee"/><rect x="808" y="384" width="154" height="28" rx="14" fill="#4c779b"/><text x="1000" y="404" font-size="17" fill="#315d86">88% → 86%</text>
