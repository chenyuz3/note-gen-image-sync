<rect x="606" y="160" width="532" height="516" rx="28" fill="#fff" stroke="#e4ded5"/>
<text x="636" y="205" font-size="22" font-weight="650" fill="#3d372f">W29 → W30：披露扩大，headline 更集中</text>
<g>
<text x="650" y="270" font-size="16" fill="#6a6259">已披露公司比例</text><rect x="808" y="248" width="80" height="28" rx="14" fill="#d8e2da"/><rect x="808" y="248" width="30" height="28" rx="14" fill="#5e8a73"/><text x="903" y="268" font-size="17" fill="#35604b">10% → 27%</text>
