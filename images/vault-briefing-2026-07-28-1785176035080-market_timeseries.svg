<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">从日频轮动到周频盈利质量</title><desc id="desc">2026年7月24日日频显示道指上涨0.46%、标普500上涨0.05%、纳指下跌0.64%、罗素2000下跌0.35%，RSP相对标普500领先0.80个百分点；FactSet周频从W29到W30显示披露比例从10%增至27%，混合盈利增长从24.7%增至37.9%，正向盈利惊喜后的平均股价反应从负0.1%变为负0.3%。</desc>
<rect width="1200" height="760" rx="40" fill="#f8f7f3"/>
<text x="62" y="78" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#2c2822">市场 cluster · 从轮动到盈利质量</text>
<text x="62" y="116" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#746b60">日频价格广度与周频会计口径分开读取；不是买卖或估值判断</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="62" y="160" width="514" height="516" rx="28" fill="#fff" stroke="#e4ded5"/>
<text x="92" y="205" font-size="22" font-weight="650" fill="#3d372f">7/24：指数分化，但市场广度更好</text>
<line x1="118" y1="410" x2="530" y2="410" stroke="#9f988f" stroke-width="2"/>
<g font-size="15" text-anchor="middle">
<rect x="142" y="335" width="58" height="75" rx="8" fill="#4c779b"/><text x="171" y="327" fill="#315d86">+0.46%</text><text x="171" y="446" fill="#4e4943">Dow</text>
<rect x="242" y="402" width="58" height="8" rx="4" fill="#5e8a73"/><text x="271" y="390" fill="#35604b">+0.05%</text><text x="271" y="446" fill="#4e4943">S&amp;P 500</text>
<rect x="342" y="410" width="58" height="104" rx="8" fill="#b7655b"/><text x="371" y="539" fill="#9e4a43">−0.64%</text><text x="371" y="570" fill="#4e4943">Nasdaq</text>
<rect x="442" y="410" width="58" height="57" rx="8" fill="#b88964"/><text x="471" y="492" fill="#8b603f">−0.35%</text><text x="471" y="523" fill="#4e4943">Russell</text>
</g>
