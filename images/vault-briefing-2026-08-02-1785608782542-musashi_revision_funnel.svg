width="280" height="70" rx="16" fill="#ffffff" stroke="#dce3e8"/><text x="866" y="340" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#b5854d" text-anchor="start">8</text><text x="930" y="339" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" fill="#53616d" text-anchor="start">ACCEPTED_RISK</text><rect x="840" y="389" width="280" height="70" rx="16" fill="#ffffff" stroke="#dce3e8"/><text x="866" y="432" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#b36b62" text-anchor="start">6</text><text x="930" y="431" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" fill="#53616d" text-anchor="start">current issues</text><rect x="840" y="490" width="280" height="92" rx="16" fill="#fff5e7" stroke="#e8c891"/><text x="980" y="524" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#6d572c" text-anchor="middle">Promotion 可复现</text><text x="980" y="555" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#9b5c4f" text-anchor="middle">≠ audit 全部封口</text><rect x="80" y="625" width="1040" height="55" rx="16" fill="#ffffff" stroke="#d8e0e4"/><text x="600" y="658" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#3e515e" text-anchor="middle">主线：股东端方差主要落在营业利润以下；边界：AI 类别需求成立，但发行人价值捕获未证。</text>
