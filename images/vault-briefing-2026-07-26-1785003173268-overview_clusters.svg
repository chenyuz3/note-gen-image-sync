<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">三个主题簇与库内连接</title><desc id="d">模型硬件协同、先进封装工艺、盈利季口径三个主题簇，通过带宽、互连和口径治理连接到旧库。</desc><rect width="1200" height="700" rx="36" fill="#f7f8f6"/><text x="70" y="76" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#17211b">三个主题簇 · 从新信息到旧知识</text><text x="70" y="116" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="19" fill="#667069">文件数不等于独立 thesis：本期 3 篇文件对应 3 个信息簇</text><g stroke="#aab5ad" stroke-width="3" fill="none"><path d="M340 258 C475 258 480 258 590 258"/><path d="M340 456 C475 456 480 456 590 456"/><path d="M870 258 C1000 258 1000 350 870 456"/></g><g transform="translate(70 180)"><rect width="270" height="156" rx="24" fill="#e6efe8"/><text x="24" y="42" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#214b32">模型 × 硬件</text><text x="24" y="78" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" fill="#476553">当前状态 · diff_unknown</text><text x="24" y="111" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" fill="#476553">state → 带宽 → 互连 → 运维</text><text x="24" y="138" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" fill="#6a756d">thesis extension</text></g><g transform="translate(590 180)"><rect width="280" height="156" rx="24" fill="#e9eef4"/><text x="24" y="42" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#294866">先进封装工艺</text><text x="24" y="78" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" fill="#526b80">新建笔记</text><text x="24" y="111" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" fill="#526b80">侧蚀 → SAP → 2.5D</text><text x="24" y="138" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" fill="#6a7580">new process explainer</text></g><g transform="translate(70 378)"><rect width="270" height="156" rx="24" fill="#f3eee5"/><text x="24" y="42" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#654c2f">盈利季口径</text><text x="24" y="78" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" fill="#755f47">当前状态 · diff_unknown</text><text x="24" y="111" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" fill="#755f47">headline vs underlying</text><text x="24" y="138" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" fill="#756f66">time-series checkpoint</text></g><g transform="translate(590 378)"><rect width="280" height="156" rx="24" fill="#eeeaf2"/><text x="24" y="42" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#534066">旧库连接</text><text x="24" y="78" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" fill="#6c5b79">推理 memory wall</text><text x="24" y="108" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" fill="#6c5b79">HBM / EMIB / glass core</text><text x="24" y="138" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" fill="#6c5b79">W27–W29 earnings baseline</text></g><g transform="translate(920 218)"><circle cx="92" cy="132" r="91" fill="#fff" stroke="#cfd6d0" stroke-width="2"/><text x="92" y="108" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="19" fill="#65716a">共同约束</text><text x="92" y="144" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="28" font-weight="700" fill="#27352d">边界条件</text><text x="92" y